name: Content and site checks
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
    # Approved-article commits are verified by the publication workflow itself.
    paths-ignore:
      - 'src/content/approved-articles/**'
      - 'src/content/withdrawn-articles.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # The job name "verify" is the required status check for develop and main.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run test:build
      - run: npm run build:mens
      - run: npm run test:subdomains
      - run: npm run build
        env:
          WORKERS_CI_BRANCH: develop
      - run: npm run test:subdomains
        env:
          WORKERS_CI_BRANCH: develop