name: Content and site checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run test:build
      - run: npm run build:mens
      - run: npm run test:subdomains
      - run: npm run build
        env:
          WORKERS_CI_BRANCH: develop
      - run: npm run test:subdomains
        env:
          WORKERS_CI_BRANCH: develop
