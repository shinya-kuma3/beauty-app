# Weekly version updates as pull requests to develop (Git-flow).
# Security alerts are notifications only; urgent fixes go through hotfix/* (see docs/ci-cd.md).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies]
    commit-message:
      prefix: 'chore(deps)'
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Tokyo
    groups:
      actions:
        patterns: ['*']
    labels: [dependencies]
    commit-message:
      prefix: 'chore(actions)'